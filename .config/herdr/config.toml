onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
# tmux: -c "#{pane_current_path}" — new panes/tabs inherit the source pane's cwd
new_cwd = "follow"

[keys]
# prefix stays ctrl+b (herdr default, same as tmux)

# tmux: bind '"' split-window -v  (top/bottom)
split_horizontal = "prefix+double_quote"
# tmux: bind % split-window -h  (side by side)
split_vertical = "prefix+percent"
# tmux: bind c new-window  (herdr default is already prefix+c)
new_tab = "prefix+c"

# tmux defaults that herdr binds to different keys
detach = "prefix+d"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
last_pane = "prefix+semicolon"

# tmux: prefix+s choose-tree → herdr's workspace picker; settings moves to prefix+S
workspace_picker = "prefix+s"
settings = "prefix+shift+s"
# tmux: prefix+$ rename-session
rename_workspace = "prefix+$"

[ui]
status_indicators = "dots"
